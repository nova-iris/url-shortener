# This workflow handles Helm chart releases when ONLY the helm chart changes
# (templates, values, Chart.yaml, etc.) WITHOUT any src/ code changes.
#
# When src/ code changes, the ci-main.yml workflow handles both:
# - Building and tagging Docker images with semantic versions
# - Updating helm chart with new image tags and releasing the chart

name: "Helm Chart Release (Chart Only)"

on:
  push:
    branches:
      - main
    paths:
      - 'release/helm-chart/**'
      - '.github/workflows/helm-chart-release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Check if this is a chart-only change (no src changes in the same commit)
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      is-skip-ci: ${{ steps.check.outputs.is-skip-ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if chart-only change
        id: check
        run: |
          # Check if commit message contains [skip ci]
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]]; then
            echo "Commit has [skip ci], skipping workflow"
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "is-skip-ci=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if src/ also changed in this commit
          SRC_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^src/' || true)

          if [ -n "$SRC_CHANGED" ]; then
            echo "src/ also changed, ci-main.yml will handle the release"
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "is-skip-ci=false" >> $GITHUB_OUTPUT
          else
            echo "Chart-only change detected, proceeding with release"
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "is-skip-ci=false" >> $GITHUB_OUTPUT
          fi

  # Bump Helm chart version based on commit message
  bump-chart-version:
    needs: check-trigger
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      bump-type: ${{ steps.bump.outputs.bump-type }}
      version-changed: ${{ steps.check-version.outputs.version-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Bump Helm chart version
        id: bump
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          CHART_FILE="release/helm-chart/url-shortener/Chart.yaml"

          # Get current version
          CURRENT_VERSION=$(yq '.version' "$CHART_FILE")
          echo "Current version: $CURRENT_VERSION"

          # Determine bump type from commit message
          if [[ "$COMMIT_MESSAGE" =~ breaking|BREAKING\ CHANGE|^feat(\(.+\))?!: ]]; then
            BUMP_TYPE="major"
          elif [[ "$COMMIT_MESSAGE" =~ ^feat ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "Bump type: $BUMP_TYPE"

          # Parse and bump version
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          case "$BUMP_TYPE" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          NEW_VERSION="${major}.${minor}.${patch}"

          echo "New version: $NEW_VERSION"

          # Update Chart.yaml
          yq eval ".version = \"$NEW_VERSION\"" -i "$CHART_FILE"

          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Check if version actually changed
        id: check-version
        run: |
          if git diff --quiet release/helm-chart/url-shortener/Chart.yaml 2>/dev/null; then
            echo "version-changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          else
            echo "version-changed=true" >> $GITHUB_OUTPUT
            echo "Version changed in Chart.yaml"
          fi

      - name: Commit version bump
        if: steps.check-version.outputs.version-changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_VERSION="${{ steps.bump.outputs.new-version }}"
          BUMP_TYPE="${{ steps.bump.outputs.bump-type }}"

          git add release/helm-chart/url-shortener/Chart.yaml

          git commit -m "chore(helm): bump chart version to $NEW_VERSION ($BUMP_TYPE)

          - Automatically bumped chart version
          - Bump type: $BUMP_TYPE
          - Triggered by: ${{ github.event.head_commit.message }}

          [skip ci]"

          git push origin main
          echo "✅ Version bump committed"

  # Lint and validate Helm chart
  helm-lint:
    needs: [check-trigger, bump-chart-version]
    if: needs.check-trigger.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: |
          cd release/helm-chart/url-shortener/
          echo "🔍 Linting Helm chart..."
          helm lint . --strict
          echo "✅ Helm lint passed"

  # Package and publish Helm chart
  helm-package:
    needs: [check-trigger, bump-chart-version, helm-lint]
    if: needs.check-trigger.outputs.should-run == 'true' && needs.bump-chart-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      chart-package: ${{ steps.package.outputs.chart-package }}
      chart-version: ${{ steps.package.outputs.chart-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Set up yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Package Helm chart
        id: package
        run: |
          cd release/helm-chart/url-shortener/

          CHART_NAME=$(yq '.name' Chart.yaml)
          CHART_VERSION=$(yq '.version' Chart.yaml)
          CHART_PACKAGE="${CHART_NAME}-${CHART_VERSION}.tgz"

          echo "📦 Packaging chart: $CHART_PACKAGE"
          helm package . --destination /tmp

          echo "chart-package=$CHART_PACKAGE" >> $GITHUB_OUTPUT
          echo "chart-name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "chart-version=$CHART_VERSION" >> $GITHUB_OUTPUT

          ls -lh /tmp/${CHART_PACKAGE}
          echo "✅ Chart packaged successfully"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}

      - name: Publish Helm chart to GHCR
        run: |
          CHART_PACKAGE="/tmp/${{ steps.package.outputs.chart-package }}"

          echo "📤 Publishing chart to GHCR..."
          helm push "$CHART_PACKAGE" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm-charts

          echo "✅ Chart published successfully!"
          echo "  Registry: ${{ env.REGISTRY }}"
          echo "  Chart: ${{ steps.package.outputs.chart-name }}"
          echo "  Version: ${{ steps.package.outputs.chart-version }}"

  # Create GitHub release and tag
  create-release:
    needs: [bump-chart-version, helm-package]
    if: needs.bump-chart-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Get chart information
        id: chart-info
        run: |
          cd release/helm-chart/url-shortener/
          CHART_VERSION=$(yq '.version' Chart.yaml)
          CHART_NAME=$(yq '.name' Chart.yaml)
          CHART_DESC=$(yq '.description' Chart.yaml)

          echo "chart-version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "chart-name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "chart-desc=$CHART_DESC" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          CHART_VERSION="${{ steps.chart-info.outputs.chart-version }}"
          TAG_NAME="helm-chart/v${CHART_VERSION}"

          echo "🏷️ Creating git tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Helm Chart Release v$CHART_VERSION" || echo "Tag already exists"
          git push origin "$TAG_NAME" 2>/dev/null || echo "Tag push skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: helm-chart/v${{ steps.chart-info.outputs.chart-version }}
          name: Helm Chart ${{ steps.chart-info.outputs.chart-name }} v${{ steps.chart-info.outputs.chart-version }}
          body: |
            ## Helm Chart Release

            **Chart:** ${{ steps.chart-info.outputs.chart-name }}
            **Version:** ${{ steps.chart-info.outputs.chart-version }}
            **Description:** ${{ steps.chart-info.outputs.chart-desc }}

            ### Installation

            ```bash
            helm registry login ${{ env.REGISTRY }} -u <username>
            helm install url-shortener oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm-charts/${{ steps.chart-info.outputs.chart-name }} --version ${{ steps.chart-info.outputs.chart-version }}
            ```

            Or upgrade an existing release:

            ```bash
            helm upgrade url-shortener oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm-charts/${{ steps.chart-info.outputs.chart-name }} --version ${{ steps.chart-info.outputs.chart-version }}
            ```

            ### Changes

            This release contains updates to the Helm chart templates or configuration.
            See commit history for detailed changes.

            ---
            *Automatically generated release*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release summary
  release-summary:
    needs: [bump-chart-version, helm-package, create-release]
    if: always() && needs.bump-chart-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Release Summary
        run: |
          echo "## 🎉 Helm Chart Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Chart-Only Release Successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Chart Version | ${{ needs.bump-chart-version.outputs.new-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bump Type | ${{ needs.bump-chart-version.outputs.bump-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chart Package | ${{ needs.helm-package.outputs.chart-package }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ghcr.io/${{ github.repository_owner }}/helm-charts |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Pull the chart with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm pull oci://ghcr.io/${{ github.repository_owner }}/helm-charts/url-shortener --version ${{ needs.bump-chart-version.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
