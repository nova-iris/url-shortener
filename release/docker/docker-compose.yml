services:
  mariadb:
    image: mariadb:11.2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: ../../src/server
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        PORT: 5000
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BASEURI: ${BACKEND_PUBLIC_URL}
      # Observability settings
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_TRACING: ${ENABLE_TRACING:-false}
      OTEL_SERVICE_NAME: urlshortener-server
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SAMPLING_RATE: ${OTEL_SAMPLING_RATE:-0.1}
    ports:
      - "5000:5000"
    labels:
      # Prometheus scraping labels
      - "prometheus.scrape=true"
      - "prometheus.port=5000"
      - "prometheus.path=/metrics"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  client:
    build:
      context: ../../src/client
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_PUBLIC_URL}
      - VITE_LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "4173:4173"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4173/" ]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Jaeger for distributed tracing (optional - enable with ENABLE_TRACING=true)
  jaeger:
    image: jaegertracing/all-in-one:1.54
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP
    networks:
      - app-network
    profiles:
      - tracing
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  # MariaDB Exporter for database metrics (optional)
  mariadb-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "${DB_USER}:${DB_PASSWORD}@tcp(mariadb:3306)/${DB_NAME}"
    ports:
      - "9104:9104"
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9104"
      - "prometheus.path=/metrics"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

volumes:
  mariadb_data:


networks:
  app-network:
    driver: bridge
