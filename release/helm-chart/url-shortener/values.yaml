# Global settings
nameOverride: ""
fullnameOverride: ""

# Image pull secrets for private registries
imagePullSecrets: []
# Example:
# imagePullSecrets:
#   - name: ghcr-secret

# Image settings
image:
  # Set to true to use locally loaded images in Minikube
  localImages: false
  # Registry settings (used when localImages is false)
  registry: ghcr.io
  organization: nova-iris

# Network configuration
networking:
  # Set to true to use Ingress, false to use NodePort
  useIngress: false
  # Host to use for external access URLs when using NodePort
  # For Minikube, this would typically be "$(minikube ip)"
  externalAccessHost: "localhost"
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: url-shortener.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# MariaDB configuration
mariadb:
  # Set to true to deploy MariaDB in the cluster
  # Set to false to use an external database
  enabled: true
  image:
    repository: mariadb
    tag: "11.2"
    pullPolicy: IfNotPresent
  # resources:
  #   requests:
  #     cpu: "500m"
  #     memory: "512Mi"
  #   limits:
  #     cpu: "1.0"
  #     memory: "1Gi"
  persistence:
    enabled: true
    size: "1Gi"
    storageClass: ""  # Use default storageClass
    # Set to true to use emptyDir (ephemeral storage)
    # This will make MariaDB use temporary storage that is lost when the pod is deleted
    # Useful for development, testing, and CI/CD pipelines
    useTemporaryStorage: false
  auth:
    rootPassword: "rootpassword"  # REQUIRED: set via values or Kubernetes Secret; do not use defaults in production
    database: "urlshortener"
    username: "urlshortener"
    password: "urlshortener_password"  # REQUIRED: set via values or Kubernetes Secret; do not use defaults in production
  service:
    type: ClusterIP
    port: 3306
  # Connection pool settings
  poolMax: 10

# External database configuration (used when mariadb.enabled is false)
externalDatabase:
  host: ""
  port: 3306
  database: "urlshortener"
  username: "urlshortener"
  password: ""  # Use existingSecret in production
  # existingSecret: ""
  # existingSecretPasswordKey: "password"

# Server (backend) configuration
server:
  image:
    repository: "urlshortener-server"
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: NodePort
    port: 5000
    nodePort: 30500  # Used when type is NodePort
  env:
    NODE_ENV: "production"
    LOG_LEVEL: "info"  # Logging level: error, warn, info, debug

# Observability configuration
observability:
  # Prometheus metrics
  metrics:
    enabled: true
    # Prometheus annotations for service discovery
    serviceMonitor:
      enabled: false  # Set to true if using Prometheus Operator
      interval: 30s
      scrapeTimeout: 10s
  
  # Distributed tracing with Jaeger
  tracing:
    enabled: false  # Set to true to enable OpenTelemetry tracing
    samplingRate: "0.1"  # 10% sampling in production
    jaeger:
      # Deploy Jaeger in the cluster
      deploy: false
      image:
        repository: jaegertracing/all-in-one
        tag: "1.54"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      service:
        type: ClusterIP
        # OTLP HTTP port
        otlpHttpPort: 4318
        # Jaeger UI port
        uiPort: 16686
      # External Jaeger endpoint (used when deploy is false)
      externalEndpoint: ""

  # MariaDB metrics exporter
  mariadbExporter:
    enabled: false
    image:
      repository: prom/mysqld-exporter
      tag: "v0.15.1"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    service:
      type: ClusterIP
      port: 9104

# Client (frontend) configuration
client:
  image:
    repository: "urlshortener-client"
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Internal backend URL for API proxy
  # The client server proxies /api requests to the internal backend service
  # Leave empty/unset to use default: http://<release>-server:<port>
  # The backend is NOT exposed to the internet - all API traffic goes through the client proxy
  # backendUrl: ""
  resources:
    requests:
      cpu: "150m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  service:
    type: NodePort
    port: 4173
    nodePort: 30173  # Used when type is NodePort
