{{- if and .Values.mariadb.enabled .Values.mariadb.persistence.enabled (not .Values.mariadb.persistence.useTemporaryStorage) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "url-shortener.fullname" . }}-mariadb-data
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.mariadb.persistence.storageClass }}
  storageClassName: {{ .Values.mariadb.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
{{- end }}
