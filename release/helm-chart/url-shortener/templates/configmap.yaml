apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "url-shortener.fullname" . }}-config
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.server.env.NODE_ENV | quote }}
  PORT: "5000"
  {{- if .Values.mariadb.enabled }}
  DB_HOST: {{ include "url-shortener.fullname" . }}-mariadb
  DB_PORT: "3306"
  DB_NAME: {{ .Values.mariadb.auth.database | quote }}
  DB_POOL_MAX: {{ .Values.mariadb.poolMax | quote }}
  {{- else }}
  DB_HOST: {{ .Values.externalDatabase.host | quote }}
  DB_PORT: {{ .Values.externalDatabase.port | quote }}
  DB_NAME: {{ .Values.externalDatabase.database | quote }}
  DB_POOL_MAX: "10"
  {{- end }}
  # Use internal cluster service URL for backend communication
  # This allows frontend to communicate with backend within the cluster
  BACKEND_PUBLIC_URL: {{ printf "http://%s:%d" (include "url-shortener.fullname" .) (int .Values.server.service.port) | quote }}
